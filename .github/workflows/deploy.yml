# Publication du site sur GitHub Pages.
#
# Le depot ne contient que les sources : le dossier `dist/` est reconstruit a
# chaque poussee sur la branche principale, puis publie. Rien a committer a la
# main, et le site en ligne correspond toujours au code de la branche.
name: Deployer sur GitHub Pages

# Toute poussee declenche le workflow, mais seule la branche par defaut du
# depot publie reellement (voir la condition `if` du job). Ainsi le site se
# deploie sans retoucher ce fichier, quel que soit le nom de cette branche.
on:
  push:
  workflow_dispatch:

# Autorisations minimales necessaires au deploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois ; les poussees suivantes attendent leur tour
# plutot que d'annuler un deploiement deja lance.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verifier les types
        run: npm run typecheck

      - name: Construire le site
        run: npm run build

      # `enablement` demande a l'action d'activer Pages en mode « GitHub
      # Actions » si ce n'est pas deja fait. Sans cela, l'etape echoue tant que
      # le depot n'a pas ete configure a la main dans ses reglages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
