# Publication du site sur GitHub Pages.
#
# Le dépôt ne contient que les sources : le dossier `dist/` est reconstruit à
# chaque poussée sur la branche principale, puis publié. Rien à committer à la
# main, et le site en ligne correspond toujours au code de la branche.
name: Déployer sur GitHub Pages

# Toute poussée déclenche le workflow, mais seule la branche par défaut du
# dépôt publie réellement (voir la condition `if` du job). Ainsi le site se
# déploie sans retoucher ce fichier, quel que soit le nom de cette branche.
on:
  push:
  workflow_dispatch:

# Autorisations minimales nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les poussées suivantes attendent leur tour
# plutôt que d'annuler un déploiement déjà lancé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire le site
        run: npm run build

      # `configure-pages` avec `enablement` n'active Pages que s'il est éteint :
      # il ne bascule pas une configuration existante « Deploy from a branch »
      # vers « GitHub Actions ». Or tant que le mode branche subsiste, le
      # constructeur historique de GitHub publie les sources brutes à chaque
      # poussée, en parallèle de ce workflow. Les deux déploiements se courent
      # après et le dernier arrivé gagne : le site alterne alors, au hasard,
      # entre la version construite et une page sans style ni script.
      #
      # On impose donc explicitement le mode « workflow ». L'étape est tolérante
      # à l'échec — elle demande des droits que le jeton n'a pas toujours — mais
      # affiche son code de retour, pour qu'un refus se voie dans le journal.
      - name: Imposer la publication par GitHub Actions
        continue-on-error: true
        run: |
          echo "Bascule de GitHub Pages en mode « workflow »…"
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' \
            -o /tmp/pages.json -w 'HTTP %{http_code}\n'
          cat /tmp/pages.json 2>/dev/null || true

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
