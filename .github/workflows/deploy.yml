# Publication du site sur GitHub Pages.
#
# Le dépôt ne contient que les sources : le dossier `dist/` est reconstruit à
# chaque poussée sur la branche principale, puis publié. Rien à committer à la
# main, et le site en ligne correspond toujours au code de la branche.
name: Déployer sur GitHub Pages

# Toute poussée déclenche le workflow, mais seule la branche par défaut du
# dépôt publie réellement (voir la condition `if` du job). Ainsi le site se
# déploie sans retoucher ce fichier, quel que soit le nom de cette branche.
on:
  push:
  workflow_dispatch:

# Autorisations minimales nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les poussées suivantes attendent leur tour
# plutôt que d'annuler un déploiement déjà lancé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire le site
        run: npm run build

      # GitHub Pages doit être réglé sur « GitHub Actions » comme source.
      # S'il reste sur « Deploy from a branch », le constructeur historique
      # publie la racine du dépôt à chaque poussée, en parallèle de ce
      # workflow : les deux déploiements se courent après et le dernier arrivé
      # gagne, si bien que le site alterne au hasard entre la version
      # construite et une page sans style ni script.
      #
      # Ce réglage ne peut pas être corrigé ici : le jeton d'Actions se voit
      # refuser l'écriture sur la configuration Pages avec un 403
      # « Resource not accessible by integration ». On se contente donc de le
      # vérifier et d'avertir bruyamment, plutôt que de laisser un site
      # instable sans explication.
      - name: Vérifier la source de GitHub Pages
        continue-on-error: true
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          type=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type','?'))" 2>/dev/null || echo '?')
          echo "Réponse $code, source déclarée : $type"
          if [ "$type" = "workflow" ]; then
            echo "Configuration correcte : le site est publié par ce workflow."
          else
            echo "::warning title=Source GitHub Pages à corriger::La source de Pages n'est pas « GitHub Actions » (valeur lue : $type). Le constructeur historique publie les sources brutes en parallèle et écrase le site une fois sur deux. Corrigez dans Settings puis Pages, section Build and deployment, Source = GitHub Actions."
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
