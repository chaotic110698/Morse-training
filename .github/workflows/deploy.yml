# Publication du site sur GitHub Pages.
#
# Le dépôt ne contient que les sources : le dossier `dist/` est reconstruit à
# chaque poussée sur la branche principale, puis publié. Rien à committer à la
# main, et le site en ligne correspond toujours au code de la branche.
name: Déployer sur GitHub Pages

# Toute poussée déclenche le workflow, mais seule la branche par défaut du
# dépôt publie réellement (voir la condition `if` du job). Ainsi le site se
# déploie sans retoucher ce fichier, quel que soit le nom de cette branche.
on:
  push:
  workflow_dispatch:

# Autorisations minimales nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; les poussées suivantes attendent leur tour
# plutôt que d'annuler un déploiement déjà lancé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire le site
        run: npm run build

      # `enablement` demande à l'action d'activer Pages en mode « GitHub
      # Actions » si ce n'est pas déjà fait. Sans cela, l'étape échoue tant que
      # le dépôt n'a pas été configuré à la main dans ses réglages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
